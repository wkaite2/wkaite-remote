name: WKAite Remote release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Public GitHub release tag
        required: true
        default: wkaite-v1.5.1.1
        type: string
  push:
    tags:
      - 'wkaite-v*'

permissions:
  contents: write

concurrency:
  group: wkaite-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify locked profile
        run: python3 -m unittest discover -s wkaite/tests -v
      - name: Verify committed source profile
        run: |
          grep -q 'mod build_profile;' src/lib.rs
          grep -q 'crate::build_profile::apply();' src/common.rs
          grep -q 'PRODUCT_NAME: &str = "WKAite Remote"' src/build_profile.rs
          grep -q 'SERVER_HOST: &str = "220.154.11.66"' src/build_profile.rs
          grep -q 'OPTION_ALLOW_AUTO_UPDATE.into(), "N".into()' src/build_profile.rs
          grep -q 'applicationId "com.wkaite.remote"' flutter/android/app/build.gradle

  build:
    needs: preflight
    uses: ./.github/workflows/flutter-build.yml
    permissions:
      contents: write
    with:
      upload-artifact: true
      upload-tag: ${{ github.event_name == 'workflow_dispatch' && inputs['release-tag'] || github.ref_name }}
      publish-update-metadata: false
    secrets: inherit

  finalize:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs['release-tag'] || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        run: gh release download "${RELEASE_TAG}" --dir release
      - name: Require signed Android assets and normalize names
        shell: bash
        run: |
          shopt -s nullglob
          signed=(release/*-signed.apk)
          if [[ "${#signed[@]}" -lt 2 ]]; then
            echo "::error::Signed Android APKs are required. Configure Android signing secrets first."
            exit 1
          fi
          for path in "${signed[@]}"; do
            canonical="${path/-signed.apk/.apk}"
            cp "${path}" "${canonical}"
          done
      - name: Generate checksums and verify cross-platform contract
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name '*-signed.apk' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cd ..
          bash wkaite/scripts/verify_release.sh release
      - name: Upload canonical APKs and checksum manifest
        run: |
          gh release upload "${RELEASE_TAG}" release/*-aarch64.apk release/*-x86_64.apk release/SHA256SUMS --clobber
          shopt -s nullglob
          for path in release/*-signed.apk; do
            gh release delete-asset "${RELEASE_TAG}" "$(basename -- "${path}")" --yes
          done
      - name: Make release public
        run: gh release edit "${RELEASE_TAG}" --prerelease=false
