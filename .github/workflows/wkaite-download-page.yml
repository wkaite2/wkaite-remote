name: WKAite download page

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'wkaite/download-site/**'
      - '.github/workflows/wkaite-download-page.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wkaite/download-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
